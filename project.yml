name: Charland
options:
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: it
  createIntermediateGroups: true
  xcodeVersion: "27.0"
  groupSortPosition: top

# L'identità (nome, identificativo, team, versione) sta in un punto solo.
configFiles:
  Debug: Config/Identita.xcconfig
  Release: Config/Identita.xcconfig

packages:
  CharlandCore:
    path: Packages/CharlandCore
  CharlandKit:
    path: Packages/CharlandKit
  # Gli aggiornamenti dell'app (19 novembre 2026): Sparkle legge appcast.xml dal sito e installa il DMG firmato.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    # Firma manuale con l'identità di sviluppo del Portachiavi: i permessi di sistema
    # restano fra una build e l'altra. La firma ad hoc li farebbe perdere.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: $(CHARLAND_SIGN_IDENTITY)
    PROVISIONING_PROFILE_SPECIFIER: ""
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: -Onone
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -O
      SWIFT_COMPILATION_MODE: wholemodule
      # Con la firma ad hoc (nessun team) il runtime protetto rifiuta le librerie incluse: Local.xcconfig lo spegne.
      ENABLE_HARDENED_RUNTIME: $(CHARLAND_HARDENED_RUNTIME)
      # Niente nomi delle funzioni negli eseguibili. I simboli restano nel dSYM, per leggere i crash.
      # Lo strip totale va solo sull'app (le librerie dinamiche interne non lo ammettono): qui quello sicuro per tutti.
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_STYLE: non-global
      STRIP_SWIFT_SYMBOLS: YES
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

targets:
  Charland:
    type: application
    platform: macOS
    sources:
      - path: Sources/Charland
      - path: Sources/Shared
      - path: Config/LaunchDaemons/com.charstudio.charland.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - package: CharlandCore
      - package: CharlandKit
      - package: Sparkle
      - target: VoiceEngine
      # L'aiutante di sistema per il coperchio chiuso: in Contents/MacOS, il suo plist di launchd in
      # Contents/Library/LaunchDaemons (lo registra SMAppService, approvato una volta da chi usa il Mac).
      - target: CharlandHelper
        embed: true
        codeSign: true
        copy:
          destination: executables
      # Il lettore di «In riproduzione»: una libreria che Charland fa girare dentro /usr/bin/perl, perché da
      # macOS 15.4 MediaRemote risponde solo ai programmi di Apple. In Contents/Frameworks.
      - target: CharlandNowPlaying
        embed: true
        codeSign: true
        link: false
        copy:
          destination: frameworks
      # Il comando da terminale sta dentro l'app, in Contents/Helpers.
      - target: CharlandCLI
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_APP_SANDBOX: NO
      configs:
        Release:
          # L'eseguibile dell'app: strip totale (le dylib interne restano a non-global).
          STRIP_STYLE: all
    info:
      path: Sources/Charland/Info.plist
      properties:
        CFBundleDisplayName: $(CHARLAND_NAME)
        CFBundleName: $(CHARLAND_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: it
        CFBundleLocalizations: [it, en]
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Char Studio"
        NSMicrophoneUsageDescription: Charland ascolta la tua voce solo mentre tieni premuto il tasto della dettatura. L'audio resta sul Mac.
        NSSpeechRecognitionUsageDescription: Charland trascrive quello che dici, direttamente sul Mac.
        NSAppleEventsUsageDescription: Charland apre la finestra giusta quando salti a una sessione di un agente o alla canzone in riproduzione.
        NSCalendarsFullAccessUsageDescription: Charland mostra i prossimi eventi del tuo calendario nell'isola. Non li modifica.
        NSLocationUsageDescription: Charland mostra il meteo del posto in cui sei. Alle previsioni arriva solo la posizione arrotondata a circa un chilometro.
        NSLocationWhenInUseUsageDescription: Charland mostra il meteo del posto in cui sei. Alle previsioni arriva solo la posizione arrotondata a circa un chilometro.
        CFBundleURLTypes:
          - CFBundleURLName: $(CHARLAND_BUNDLE_ID)
            CFBundleURLSchemes: [$(CHARLAND_URL_SCHEME)]
        # Sparkle (solo build ufficiali, `CHARLAND_OFFICIAL`): l'elenco delle versioni sul sito e la chiave pubblica
        # Ed25519 che verifica ogni DMG scaricato. Le altre build non creano l'updater.
        SUFeedURL: https://charland.charstudio.app/appcast.xml
        SUPublicEDKey: $(CHARLAND_SPARKLE_KEY)
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAllowsAutomaticUpdates: true
    entitlements:
      path: Sources/Charland/Charland.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.automation.apple-events: true
        # Il prossimo impegno nel Dock: con il runtime rinforzato, senza questo il Calendario risponde «negato» senza chiedere.
        com.apple.security.personal-information.calendars: true
        # Il meteo con «Automatica»: con il runtime rinforzato, senza questo la posizione risponde «negata» senza chiedere.
        com.apple.security.personal-information.location: true

  # Il comando da terminale: charland post, update, end, watch, hook.
  # Il bersaglio si chiama CharlandCLI e non "charland": su un disco che non distingue
  # maiuscole e minuscole si confonderebbe con l'app.
  # Il lettore di «In riproduzione» (Objective-C, senza Swift: perl lo carica com'è).
  CharlandNowPlaying:
    type: library.dynamic
    platform: macOS
    sources:
      - path: Sources/NowPlaying
    settings:
      base:
        PRODUCT_NAME: CharlandNowPlaying
        EXECUTABLE_PREFIX: lib
        CLANG_ENABLE_OBJC_ARC: YES
        OTHER_LDFLAGS: -framework Foundation
        SKIP_INSTALL: YES
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        ENABLE_HARDENED_RUNTIME: NO

  # L'aiutante di sistema (root) per il sonno a coperchio chiuso, senza password a ogni accensione.
  CharlandHelper:
    type: tool
    platform: macOS
    sources:
      - path: Sources/CharlandHelper
      - path: Sources/Shared/HelperProtocol.swift
    settings:
      base:
        PRODUCT_NAME: CharlandHelper
        PRODUCT_BUNDLE_IDENTIFIER: $(CHARLAND_BUNDLE_ID).helper
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES

  CharlandCLI:
    type: tool
    platform: macOS
    sources:
      - path: Sources/charland-cli
    dependencies:
      - package: CharlandKit
    settings:
      base:
        PRODUCT_NAME: $(CHARLAND_CLI)
        PRODUCT_MODULE_NAME: CharlandCLI
        PRODUCT_BUNDLE_IDENTIFIER: $(CHARLAND_BUNDLE_ID).cli
        SKIP_INSTALL: YES

  # Il motore vocale: un processo a parte, senza accesso alla rete.
  VoiceEngine:
    type: xpc-service
    platform: macOS
    sources:
      - path: Sources/VoiceEngine
      - path: Sources/Shared
    dependencies:
      - framework: Vendor/sherpa-onnx/lib/libsherpa-onnx-c-api.dylib
        embed: true
      - framework: Vendor/sherpa-onnx/lib/libonnxruntime.dylib
        embed: true
    settings:
      base:
        PRODUCT_NAME: VoiceEngine
        PRODUCT_BUNDLE_IDENTIFIER: $(CHARLAND_BUNDLE_ID).voce
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Vendor/sherpa-onnx/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Vendor/sherpa-onnx/lib
        LD_RUNPATH_SEARCH_PATHS: "@loader_path/../Frameworks"
        ENABLE_APP_SANDBOX: NO
    info:
      path: Sources/VoiceEngine/Info.plist
      properties:
        CFBundleName: VoiceEngine
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        XPCService:
          ServiceType: Application

schemes:
  Charland:
    build:
      targets:
        Charland: all
    run:
      config: Debug
